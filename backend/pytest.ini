[pytest]
# All Debugly tests are plain functions. Restrict class collection to a prefix
# we never use for domain models, so Pydantic models imported into test
# modules (e.g. the `TestCase` execution model) are not mis-collected.
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = _DebuglyNoSuchClass
